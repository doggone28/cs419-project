{% extends "base.html" %}
{% block title %}Login — SecureDocs{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Sign In</h4>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('login') }}" autocomplete="off" novalidate>

          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username"
                   maxlength="20" required autofocus>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <input type="password" class="form-control" id="password" name="password"
                     maxlength="128" required>
              <button class="btn btn-outline-secondary" type="button"
                      onclick="togglePassword('password', this)"
                      aria-label="Show password">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="eye-icon" viewBox="0 0 16 16">
                  <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                  <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <hr>

        <p class="text-center mb-0">
          Don't have an account? <a href="{{ url_for('register') }}">Register</a>
        </p>

        <p class="text-center mb-0 mt-2">
          <a href="{{ url_for('forgot_password') }}" class="text-muted small">
            Forgot your password?
          </a>
        </p>
      </div>
    </div>

    <div class="mt-3 text-muted small text-center">
      Account is locked for 15 minutes after 5 failed attempts.
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>

{% endblock %}
