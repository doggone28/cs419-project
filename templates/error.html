{% extends "base.html" %}
{% block title %}Error {{ code }} — SecureDocs{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div style="font-size:5rem">
    {% if code == 403 %}🚫{% elif code == 404 %}🔍{% else %}💥{% endif %}
  </div>
  <h1 class="mt-3">{{ code }}</h1>
  <p class="lead text-muted">{{ message }}</p>
  <a href="{{ url_for('dashboard') if user else url_for('login') }}"
     class="btn btn-primary mt-2">← Go back</a>
</div>
{% endblock %}
